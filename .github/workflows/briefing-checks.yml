name: Briefing regression checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r tools/briefing/requirements.txt
      - run: python -m unittest discover -s tools/briefing -p 'test_*.py' -v
      - run: python tools/briefing/check.py
      - name: Manually reproducible offline integration test (all types)
        run: |
          for kind in game ai research; do
            python tools/briefing/run.py --kind "$kind" --mode fixture --output "output/briefing/$kind"
            cp "output/briefing/$kind/_posts/"*.md _posts/
          done
          python tools/briefing/check.py --pages > /tmp/fixture-pages.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify all three generated Chirpy pages and internal links
        env:
          JEKYLL_ENV: production
        run: |
          # Fixtures use 08:00 KST; include them in tests even before that time.
          bundle exec jekyll build --future --destination _site
          bundle exec htmlproofer _site --disable-external --ignore-urls '/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/'
          while IFS= read -r page; do
            test -s "_site${page}index.html"
            grep -q 'briefing-heading' "_site${page}index.html"
          done < /tmp/fixture-pages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-offline-integration-${{ github.run_id }}
          path: output/briefing
          retention-days: 14
