name: Briefing generation (manual first)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fixture: 무료 합성 시험 / live: 승인한 유료 API 호출'
        type: choice
        options: [fixture, live]
        default: fixture
      kind:
        description: 브리핑 종류
        type: choice
        options: [all, game, ai, research]
        default: all
  schedule:
    # 07:55 KST daily; Thursday UTC is Friday KST.
    - cron: '55 22 * * *'
    - cron: '50 22 * * 4'

# Repository variables must both be explicitly enabled before paid schedules run.
permissions:
  contents: read

concurrency:
  group: briefing-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      kinds: ${{ steps.plan.outputs.kinds }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          KIND: ${{ inputs.kind }}
          PAID: ${{ vars.BRIEFING_PAID_ENABLED }}
          SCHEDULED: ${{ vars.BRIEFING_SCHEDULE_ENABLED }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          mode = os.environ['MODE'] or 'live'
          kind = os.environ['KIND'] or 'all'
          enabled = True
          if mode == 'live':
              enabled = os.environ['PAID'] == 'true'
          if os.environ['EVENT'] == 'schedule':
              enabled = enabled and os.environ['SCHEDULED'] == 'true'
              kinds = ['research'] if os.environ['SCHEDULE'] == '50 22 * * 4' else ['game', 'ai']
          else:
              kinds = ['game', 'ai', 'research'] if kind == 'all' else [kind]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(enabled).lower()}\nmode={mode}\nkinds={json.dumps(kinds)}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('유료 API와 예약 실행은 저장소 변수로 별도 승인해야 합니다.\n' if not enabled else f'실행 모드: {mode}; 종류: {kinds}\n')
          PY

  generate:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kind: ${{ fromJSON(needs.prepare.outputs.kinds) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # workflow_dispatch may select the unmerged implementation branch for fixture testing.
      - name: Select manual test branch
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "$TEST_REF"
        env:
          TEST_REF: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r tools/briefing/requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tools/briefing -p 'test_*.py' -v
      - name: Generate and verify independent posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.BRIEFING_GITHUB_TOKEN || github.token }}
          BRIEFING_PAID_ENABLED: ${{ vars.BRIEFING_PAID_ENABLED }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          MODE: ${{ needs.prepare.outputs.mode }}
          KIND: ${{ matrix.kind }}
        run: python tools/briefing/run.py --kind "$KIND" --mode "$MODE" --repo "$GITHUB_REPOSITORY" --output output/briefing
      - name: Stage generated posts in build workspace
        id: staged
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          report = json.loads(pathlib.Path('output/briefing/report.json').read_text())
          for post in report['posts']:
              shutil.copyfile(pathlib.Path('output/briefing/_posts') / post['file'], pathlib.Path('_posts') / post['file'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={len(report['posts'])}\n")
          PY
      - name: Validate metadata and live source links
        if: steps.staged.outputs.count != '0'
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          python tools/briefing/check.py --posts output/briefing/_posts
          if [ "$MODE" = live ]; then python tools/briefing/check.py --posts output/briefing/_posts --links; fi
      - uses: ruby/setup-ruby@v1
        if: steps.staged.outputs.count != '0'
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build and verify actual Chirpy layout
        if: steps.staged.outputs.count != '0'
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --destination _site
          bundle exec htmlproofer _site --disable-external --ignore-urls '/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/'
          python tools/briefing/check.py --posts output/briefing/_posts --pages > /tmp/briefing-pages.txt
          while IFS= read -r page; do
            test -s "_site${page}index.html"
            grep -q 'briefing-heading' "_site${page}index.html"
          done < /tmp/briefing-pages.txt
      - name: Submit one review PR
        if: needs.prepare.outputs.mode == 'live' && steps.staged.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BRIEFING_GITHUB_TOKEN || github.token }}
        run: python tools/briefing/publish.py --repo "$GITHUB_REPOSITORY" --output output/briefing
      - name: Save run report and usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ matrix.kind }}-${{ github.run_id }}
          path: output/briefing
          if-no-files-found: warn
          retention-days: 14
      - name: Run summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          KIND: ${{ matrix.kind }}
        run: |
          echo "브리핑: $KIND / 결과: $STATUS. report.json에서 생성·제외·오류·API 사용량을 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/briefing/pr-url.txt ]; then cat output/briefing/pr-url.txt >> "$GITHUB_STEP_SUMMARY"; fi
