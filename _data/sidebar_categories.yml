# 사이드바 카테고리 목록에 보일 순서 (이름은 README의 카테고리 표와 똑같이)
# - name: 큰 카테고리 / icon: 앞에 붙는 Font Awesome 아이콘 / children: 그 아래 작은 카테고리 순서
# - 글이 하나라도 있는 카테고리만 사이드바에 나와요 (빈 카테고리는 페이지가 없어서 링크가 깨지기 때문)
# - 여기 없는 카테고리로 글을 쓰면 같은 단계의 맨 아래에 가나다순으로 자동으로 붙어요
- name: 레퍼런스 조사
  icon: fas fa-magnifying-glass
  children:
    - 업계 뉴스
    - 개발 도구
    - 기획 연구
- name: 게임 제작 공부
  icon: fas fa-book-open
  children:
    - 유니티
    - 유니티 에셋
    - 3D 모델링
    - 2D 그림
- name: 개발 일지
  icon: fas fa-hammer
- name: 일상
  icon: fas fa-mug-hot
